x-database-url: &database-url mysql://${DB_USER:?}:${DB_PASSWORD:?}@${DB_HOST:-db}:${DB_PORT:-3306}/${DB_NAME:?}?allowPublicKeyRetrieval=true

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: ${DB_NAME:?}
      MYSQL_USER: ${DB_USER:?}
      MYSQL_PASSWORD: ${DB_PASSWORD:?}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  migrate:
    build: .
    command: npx prisma migrate deploy
    restart: "no"
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  backend:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      PORT: ${PORT:-3000}
      TOKEN_SECRET: ${TOKEN_SECRET:?}
      DATABASE_URL: *database-url
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - app-network

volumes:
  mysql-data:

networks:
  app-network:
    driver: bridge
